<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fernsprecher-KI-Modus — an AI agent joins a FaceTime link as a web guest.">
  <title>Fernsprecher-KI-Modus</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7fb; --ink:#17202b; --muted:#5d6876; --surface:rgba(255,255,255,.76); --line:rgba(23,32,43,.13); --accent:#10a37f; --accent-2:#55d6b3; --orb-core:#d8fff2; --shadow:0 18px 55px rgba(15,27,42,.12); }
    [data-theme="dark"] { color-scheme: dark; --bg:#0d1219; --ink:#eef5f3; --muted:#a7b6b4; --surface:rgba(22,31,42,.72); --line:rgba(231,245,240,.14); --accent:#38d7a8; --accent-2:#9cf3d4; --orb-core:#c3ffe8; --shadow:0 20px 70px rgba(0,0,0,.34); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color:inherit; }
    .shell { width:min(1140px, calc(100% - 40px)); margin:auto; }
    .nav { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:20px 0; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:760; letter-spacing:-.025em; text-decoration:none; white-space:nowrap; }
    .mini-orb { width:28px; height:28px; border-radius:50%; background:radial-gradient(circle at 36% 30%, var(--orb-core), var(--accent-2) 26%, var(--accent) 58%, #08735c); box-shadow:0 0 22px color-mix(in srgb, var(--accent) 70%, transparent); }
    .controls { display:flex; gap:8px; align-items:center; }
    button, select { appearance:none; border:1px solid var(--line); color:var(--ink); background:var(--surface); border-radius:10px; font:inherit; padding:8px 10px; }
    button { cursor:pointer; min-width:42px; }
    button:hover, select:hover { border-color:var(--accent); }
    .hero { position:relative; overflow:hidden; display:grid; grid-template-columns:1.15fr .85fr; align-items:center; gap:52px; padding:66px 0 86px; }
    .hero::before { content:""; position:absolute; width:640px; height:640px; right:-250px; top:-240px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 67%); pointer-events:none; }
    .eyebrow { color:var(--accent); font-weight:760; letter-spacing:.09em; text-transform:uppercase; font-size:.75rem; }
    h1 { margin:12px 0 18px; max-width:760px; font-size:clamp(2.65rem, 7vw, 5.9rem); line-height:.96; letter-spacing:-.065em; }
    .lede { max-width:620px; color:var(--muted); font-size:1.18rem; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:10px 17px; border-radius:12px; font-weight:700; text-decoration:none; }
    .primary { color:#05271e; background:var(--accent-2); }
    .secondary { border:1px solid var(--line); background:var(--surface); }
    .call-tile { position:relative; justify-self:center; width:min(100%, 390px); min-height:330px; overflow:hidden; padding:29px; border:1px solid var(--line); border-radius:30px; background:linear-gradient(145deg, color-mix(in srgb, var(--surface) 85%, var(--accent) 15%), var(--surface)); box-shadow:var(--shadow); }
    .tile-top { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:.85rem; }
    .live { display:flex; gap:6px; align-items:center; color:var(--accent); font-weight:750; }
    .live i { display:block; width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; }
    .orb { position:relative; width:170px; height:170px; margin:43px auto 31px; border-radius:50%; background:radial-gradient(circle at 37% 30%, #fff 0 3%, var(--orb-core) 11%, var(--accent-2) 31%, var(--accent) 61%, #075d4a 100%); box-shadow:0 0 0 14px color-mix(in srgb, var(--accent) 10%, transparent), 0 0 68px color-mix(in srgb, var(--accent) 60%, transparent); animation:breathe 4.2s ease-in-out infinite; }
    .orb::after { content:""; position:absolute; inset:18px; border-radius:50%; border:1px solid rgba(255,255,255,.45); }
    .tile-name { font-size:1.25rem; font-weight:780; text-align:center; }
    .tile-status { margin-top:3px; color:var(--muted); text-align:center; }
    @keyframes breathe { 50% { transform:scale(1.045); box-shadow:0 0 0 21px color-mix(in srgb, var(--accent) 8%, transparent), 0 0 86px color-mix(in srgb, var(--accent) 72%, transparent); } }
    section { padding:78px 0; border-top:1px solid var(--line); }
    .section-head { max-width:680px; margin-bottom:32px; }
    h2 { margin:7px 0 10px; font-size:clamp(1.85rem, 4vw, 3.2rem); line-height:1.05; letter-spacing:-.045em; }
    .section-head p { margin:0; color:var(--muted); font-size:1.05rem; }
    .cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
    .card { padding:25px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:0 7px 24px rgba(9,19,31,.035); }
    .card h3 { margin:0 0 8px; font-size:1.1rem; letter-spacing:-.015em; }
    .card p { margin:0; color:var(--muted); }
    .number { display:grid; place-items:center; width:31px; height:31px; margin-bottom:22px; border-radius:9px; color:#05271e; background:var(--accent-2); font-weight:800; }
    .agent-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
    .agent-card { --agent:#8f95a5; --agent-deep:#262834; position:relative; min-height:272px; overflow:hidden; padding:24px; border:1px solid color-mix(in srgb, var(--agent) 42%, var(--line)); border-radius:22px; background:linear-gradient(145deg, color-mix(in srgb, var(--agent) 17%, var(--agent-deep)), var(--agent-deep)); box-shadow:0 14px 35px color-mix(in srgb, var(--agent) 13%, transparent); }
    .agent-card::after { content:""; position:absolute; width:180px; height:180px; right:-75px; top:-85px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--agent) 40%, transparent), transparent 67%); pointer-events:none; }
    .agent-card.claude { --agent:#d97757; --agent-deep:#1a1917; }
    .agent-card.gpt { --agent:#10a37f; --agent-deep:#202123; }
    .agent-card.custom { --agent:#a9a7f8; --agent-deep:#20202a; }
    .agent-orb { position:relative; z-index:1; width:54px; height:54px; margin-bottom:20px; border-radius:50%; background:radial-gradient(circle at 34% 27%, #fff 0 5%, color-mix(in srgb, var(--agent) 28%, #fff) 18%, var(--agent) 58%, var(--agent-deep) 100%); box-shadow:0 0 0 8px color-mix(in srgb, var(--agent) 12%, transparent), 0 0 30px color-mix(in srgb, var(--agent) 62%, transparent); }
    .custom .agent-orb { background:radial-gradient(circle at 34% 27%, #fff 0 4%, #d8d6ff 17%, #a9a7f8 39%, #6ed7cb 62%, #d58dbb 82%, #242331 100%); }
    .agent-card h3 { position:relative; z-index:1; margin:0 0 7px; color:#fff; font-size:1.25rem; letter-spacing:-.025em; }
    .agent-card p { position:relative; z-index:1; min-height:50px; margin:0; color:rgba(255,255,255,.72); }
    .cmd-row { position:relative; z-index:1; display:flex; align-items:stretch; gap:8px; margin-top:19px; }
    .agent-command { display:block; flex:1; min-width:0; padding:10px 11px; border:1px solid rgba(255,255,255,.16); border-radius:10px; color:rgba(255,255,255,.9); background:rgba(0,0,0,.2); font:600 .77rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:normal; overflow-wrap:anywhere; }
    .copy-btn { flex:none; width:40px; border:1px solid rgba(255,255,255,.16); border-radius:10px; background:rgba(255,255,255,.08); color:rgba(255,255,255,.85); cursor:pointer; display:grid; place-items:center; transition:background .2s, color .2s, border-color .2s; }
    .copy-btn:hover { background:rgba(255,255,255,.16); }
    .copy-btn:focus-visible { outline:2px solid var(--agent); outline-offset:2px; }
    .copy-btn.done { color:var(--agent); border-color:var(--agent); }
    .copy-btn svg { width:18px; height:18px; }
    .privacy { display:grid; grid-template-columns:.8fr 1.2fr; gap:24px; padding:32px; border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:24px; background:linear-gradient(125deg, color-mix(in srgb, var(--accent) 13%, var(--surface)), var(--surface)); }
    .privacy h2 { margin:8px 0; }
    .checks { display:grid; gap:14px; align-content:center; }
    .check { display:flex; gap:11px; align-items:flex-start; }
    .check b { color:var(--accent); font-size:1.25rem; line-height:1.2; }
    .check p { margin:0; color:var(--muted); }
    .requirements { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .requirement { padding:22px; border-left:3px solid var(--accent); background:var(--surface); border-radius:0 16px 16px 0; }
    .requirement strong { display:block; margin-bottom:5px; }
    .requirement span { color:var(--muted); }
    footer { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:32px 0 44px; color:var(--muted); font-size:.9rem; }
    footer a { color:var(--ink); font-weight:700; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:760px) { .shell { width:min(100% - 28px, 600px); } .nav { padding:14px 0; } .brand { font-size:.93rem; } .hero { grid-template-columns:1fr; gap:30px; padding:42px 0 58px; } .call-tile { width:min(100%, 365px); } .cards, .agent-grid, .requirements, .privacy { grid-template-columns:1fr; } section { padding:58px 0; } footer { align-items:flex-start; flex-direction:column; gap:10px; } }
  </style>
</head>

    };
    const agentCopy = {
      en:{eye:'Choose your caller',title:'Three agents. One call.',text:'Each profile keeps its own name, language, speech recognition, voice and session folder. All three can share one conversation.',agents:[['Claude','A warm, conversational voice with its own profile.','claude','claude'],['GPT / Codex','Can also keep going unattended with --respond.','gpt','gpt'],['AI agent','Bring your own agent and colours.','custom','custom']]},
      de:{eye:'Wer soll anrufen?',title:'Drei Agenten. Ein Gespräch.',text:'Jedes Profil hat seinen eigenen Namen, seine Sprache, Spracherkennung, Stimme und einen eigenen Sitzungsordner. Alle drei können im selben Gespräch dabei sein.',agents:[['Claude','Warm im Ton, mit eigenem Profil für Sprache, Stimme und Erkennung.','claude','claude'],['GPT / Codex','Kann mit --respond auch unbeaufsichtigt weiterarbeiten.','gpt','gpt'],['KI-Agent','Eigener Agent, eigene Farben – ganz nach deinem Geschmack.','custom','custom']]},

    };
    const $ = id => document.getElementById(id), langs = Object.keys(copy);
    function fillCards(id, entries, numbered=false) { $(id).replaceChildren(...entries.map((x,i)=>{ const d=document.createElement('article'); d.className='card'; d.innerHTML=(numbered?`<div class="number">${i+1}</div>`:'')+`<h3>${x[0]}</h3><p>${x[1]}</p>`; return d; })); }
    function fillAgents(entries) { $('agentCards').replaceChildren(...entries.map(x=>{ const d=document.createElement('article'); d.className=`agent-card ${x[3]}`; d.innerHTML=`<div class="agent-orb" aria-hidden="true"></div><h3>${x[0]}</h3><p>${x[1]}</p><div class="cmd-row"><code class="agent-command">fernsprecher-ki-modus-an --agent ${x[2]} join &quot;&lt;link&gt;&quot;</code><button class="copy-btn" type="button" aria-label="${COPY[document.documentElement.lang] || COPY.en}" title="${COPY[document.documentElement.lang] || COPY.en}">${ICON_COPY}</button></div>`; return d; })); }
    const COPY = { en: 'Copy', de: 'Kopieren', fr: 'Copier', da: 'Kopiér', ja: 'コピー' };
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
    const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    document.addEventListener('click', async e => {
      const b = e.target.closest('.copy-btn'); if (!b) return;
      const text = b.parentElement.querySelector('code').textContent;
      try { await navigator.clipboard.writeText(text); }
      catch { const r = document.createRange(); r.selectNodeContents(b.parentElement.querySelector('code')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand('copy'); sel.removeAllRanges(); }
      b.innerHTML = ICON_DONE; b.classList.add('done');
      clearTimeout(b._t); b._t = setTimeout(() => { b.innerHTML = ICON_COPY; b.classList.remove('done'); }, 1600);
    });
    function render(lang) { const c=copy[lang], a=agentCopy[lang]; document.documentElement.lang=lang; document.title='Fernsprecher-KI-Modus'; ['eye','title','lede','guest','listening','status','whatEye','whatTitle','whatText','howEye','howTitle','howText','privacyEye','privacyTitle','privacyText','reqEye','reqTitle','reqText','footer'].forEach(k=>{ const map={eye:'eyebrow',title:'title',lede:'lede',guest:'guest',listening:'listening',status:'tileStatus',whatEye:'whatEye',whatTitle:'whatTitle',whatText:'whatText',howEye:'howEye',howTitle:'howTitle',howText:'howText',privacyEye:'privacyEye',privacyTitle:'privacyTitle',privacyText:'privacyText',reqEye:'reqEye',reqTitle:'reqTitle',reqText:'reqText',footer:'footer'}; $(map[k]).textContent=c[k]; }); ['eye','title','text'].forEach(k=>{ $('agents'+k[0].toUpperCase()+k.slice(1)).textContent=a[k]; }); $('release').textContent=c.release; $('learn').textContent=c.learn; fillCards('whatCards',c.cards); fillAgents(a.agents); fillCards('steps',c.steps,true); $('checks').replaceChildren(...c.checks.map(x=>{const d=document.createElement('div');d.className='check';d.innerHTML=`<b>✓</b><p><strong>${x[0]}</strong><br>${x[1]}</p>`;return d;})); $('reqs').replaceChildren(...c.reqs.map(x=>{const d=document.createElement('div');d.className='requirement';d.innerHTML=`<strong>${x[0]}</strong><span>${x[1]}</span>`;return d;})); $('language').value=lang; localStorage.setItem('fernsprecher-language',lang); }
    const select=$('language'); langs.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=copy[l].name;select.append(o)});
    const saved=localStorage.getItem('fernsprecher-language'); const detected=(navigator.language||'en').slice(0,2); render(saved&&copy[saved]?saved:(copy[detected]?detected:'en'));
    select.addEventListener('change',e=>render(e.target.value));
    const theme=$('theme'), savedTheme=localStorage.getItem('fernsprecher-theme'); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
    theme.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('fernsprecher-theme',next);});
  </script>
