<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Fernsprecher-KI-Modus</title>
  <desc id="desc">A glowing two-tone coral and green orb beside the Fernsprecher-KI-Modus title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10211f"/><stop offset="1" stop-color="#13213a"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d97757"/><stop offset=".48" stop-color="#ca8a6d"/><stop offset="1" stop-color="#10a37f"/></linearGradient>
    <radialGradient id="shine" cx="35%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".92"/><stop offset=".2" stop-color="#ffffff" stop-opacity=".18"/><stop offset=".62" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d97757"/><stop offset="1" stop-color="#10a37f"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#000000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="157" cy="204" r="118" fill="#d97757" opacity=".22" filter="url(#blur)"/>
  <circle cx="241" cy="204" r="118" fill="#10a37f" opacity=".24" filter="url(#blur)"/>
  <circle cx="199" cy="204" r="104" fill="url(#orb)" filter="url(#shadow)"/>
  <circle cx="199" cy="204" r="104" fill="url(#shine)"/>
  <circle cx="199" cy="204" r="82" fill="none" stroke="#ffffff" stroke-opacity=".43"/>
  <circle cx="199" cy="204" r="118" fill="none" stroke="url(#accent)" stroke-opacity=".55"/>
  <g fill="#eafff8"><text x="365" y="177" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="750" letter-spacing="-2">Fernsprecher-KI-Modus</text><text x="369" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#b9d8cf">An AI guest for your FaceTime conversation.</text></g>
  <g fill="url(#accent)"><circle cx="372" cy="279" r="6"/><text x="389" y="286" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650">LISTENING, THINKING, POLITELY NOT USING A CAMERA</text></g>
</svg>
